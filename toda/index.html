<!doctype html>
<html lang="he" dir="rtl" data-purchase>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>תודה | HOME-MADE</title>
<script src="/pixel.js?v=1"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/sam.css?v=1">
<style>
/* the simplest thank-you page: one centered card on the page's dark background */
.thx{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:56px 16px;text-align:center;position:relative;overflow:hidden}
.thx .aura{pointer-events:none}
.thx__in{position:relative;z-index:2;max-width:760px;display:flex;flex-direction:column;align-items:center}
.thx__ph{position:relative;width:148px;height:148px;margin-bottom:34px}
.thx__ph img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;border-radius:50%;box-shadow:0 30px 60px -28px rgb(0 0 0 / .9),0 0 0 6px rgb(231 168 107 / .14)}
.thx__ok{position:absolute;inset-inline-start:-4px;bottom:2px;width:44px;height:44px;border-radius:50%;background:var(--sky);color:var(--deep);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px -8px rgb(0 0 0 / .7)}
.thx__ok svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.thx h1{margin:0 0 16px;font-size:clamp(34px,6vw,56px);line-height:1.12;font-weight:800;color:#fff}
.thx__in p{margin:0;font-size:clamp(17px,2.2vw,20px);color:var(--ice-txt)}
.thx .thx__brand{position:relative;z-index:2;margin:64px 0 0;font-size:14px;color:var(--ink-3)}
</style>
</head>
<body>
<main class="thx">
  <div class="aura aura--a" aria-hidden="true"></div>
  <div class="thx__in">
    <div class="thx__ph">
      <img src="/assets/or-25.webp" alt="אור לוין" width="800" height="1200">
      <span class="thx__ok" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></span>
    </div>
    <h1>תודה, <span class="grad-l">הרכישה התקבלה</span></h1>
    <p>ברוכה הבאה לתכנית <bdi>HOME-MADE</bdi>. <span class="nw">מכאן מתחילים ליצור.</span></p>
  </div>
  <p class="thx__brand">© גרציה | בית מלאכה</p>
</main>
</body>
</html>
